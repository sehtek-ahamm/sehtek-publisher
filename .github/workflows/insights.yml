name: Pull Instagram insights

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r publisher/requirements.txt
      - name: Pull insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: python publisher/insights.py /tmp/insights.json
      - name: Save to review-insights branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan review-insights
          git rm -rfq .
          mkdir -p review-insights && cp /tmp/insights.json review-insights/insights.json
          git add review-insights && git commit -qm "Insights $(date -u +%FT%TZ)"
          git push -f origin review-insights
