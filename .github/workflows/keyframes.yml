name: Keyframes (OpenAI images)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Keyframe list, e.g. production/keyframes/luxury-kitchen.json"
        required: true
        type: string
      quality:
        description: "Image quality: medium or high"
        default: "high"
        type: string

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r production/requirements.txt
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_QUALITY: ${{ inputs.quality }}
          SPEC: ${{ inputs.spec }}
        run: |
          NAME=$(basename "$SPEC" .json)
          python production/keyframes.py "$SPEC" "review-keyframes/$NAME"
          git config user.name "sehtek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "review-keyframes"
          git add -f review-keyframes
          git commit -q -m "Keyframes: $NAME"
          git push -f origin review-keyframes
