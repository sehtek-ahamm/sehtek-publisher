name: Check Higgsfield key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
          HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
        run: python production/check_higgsfield.py
